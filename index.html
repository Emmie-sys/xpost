<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>X Post Generator</title>
  <style>
    @font-face {
      font-family: 'TwitterChirp';
      src: url('https://abs.twimg.com/fonts/v2/chirp-regular-web.woff2') format('woff2');
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }
    @font-face {
      font-family: 'TwitterChirp';
      src: url('https://abs.twimg.com/fonts/v2/chirp-medium-web.woff2') format('woff2');
      font-weight: 500;
      font-style: normal;
      font-display: swap;
    }
    @font-face {
      font-family: 'TwitterChirp';
      src: url('https://abs.twimg.com/fonts/v2/chirp-bold-web.woff2') format('woff2');
      font-weight: 700;
      font-style: normal;
      font-display: swap;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #000000;
      color: #e7e9ea;
      font-family: TwitterChirp, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 40px 16px;
      line-height: 1.3;
    }

    .wrapper { width: 100%; max-width: 600px; }

    /* ========== FORM ========== */
    #form-section {
      background: #16181c;
      border: 1px solid #2f3336;
      border-radius: 16px;
      padding: 24px;
      margin-bottom: 32px;
    }

    #form-section h1 {
      font-size: 20px;
      font-weight: 700;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .form-group { margin-bottom: 16px; }

    label {
      display: block;
      font-size: 13px;
      color: #71767b;
      margin-bottom: 6px;
      font-weight: 500;
    }

    textarea, input[type="number"], input[type="text"] {
      width: 100%;
      background: #000;
      border: 1px solid #2f3336;
      border-radius: 8px;
      color: #e7e9ea;
      font-family: inherit;
      font-size: 15px;
      padding: 12px;
      outline: none;
      transition: border-color 0.2s;
    }

    textarea:focus, input:focus { border-color: #1d9bf0; }

    textarea {
      min-height: 120px;
      resize: vertical;
      line-height: 1.4;
    }

    .row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    button {
      background: #1d9bf0;
      color: #fff;
      border: none;
      border-radius: 9999px;
      padding: 12px 24px;
      font-size: 15px;
      font-weight: 700;
      font-family: inherit;
      cursor: pointer;
      width: 100%;
      margin-top: 8px;
      transition: background 0.2s;
    }

    button:hover { background: #1a8cd8; }

    button.secondary {
      background: transparent;
      border: 1px solid #536471;
      color: #e7e9ea;
      margin-top: 12px;
    }

    button.secondary:hover { background: rgba(239, 243, 244, 0.1); }

    .hint-small {
      font-size: 12px;
      color: #71767b;
      margin-top: 6px;
    }

    /* ========== POST CARD ========== */
    #post-section { display: none; }

    .post-card {
      background: #000000;
      border: 1px solid #2f3336;
      border-radius: 16px;
      padding: 12px 16px;
    }

    .post-header {
      display: flex;
      gap: 12px;
      margin-bottom: 4px;
    }

    .avatar-container {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      overflow: hidden;
      flex-shrink: 0;
      position: relative;
    }

    .avatar-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: none;
    }

    .avatar-fallback {
      width: 100%;
      height: 100%;
      background: linear-gradient(135deg, #1d9bf0, #7856ff);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 15px;
      color: #fff;
      user-select: none;
    }

    .user-meta { flex: 1; min-width: 0; }

    .name-row {
      display: flex;
      align-items: center;
      gap: 4px;
      flex-wrap: wrap;
    }

    .display-name {
      font-weight: 700;
      font-size: 15px;
      color: #e7e9ea;
    }

    .verified {
      width: 18px;
      height: 18px;
      fill: #1d9bf0;
      flex-shrink: 0;
    }

    .handle-time {
      font-size: 15px;
      color: #71767b;
      display: flex;
      align-items: center;
      gap: 4px;
      margin-top: 1px;
    }

    .dot { font-size: 15px; }

    .post-content {
      font-size: 15px;
      color: #e7e9ea;
      white-space: pre-wrap;
      word-wrap: break-word;
      margin: 12px 0 16px 52px;
      line-height: 1.3125;
    }

    /* Metrics */
    .metrics {
      display: flex;
      justify-content: space-between;
      max-width: 480px;
      margin-left: 52px;
      padding-top: 4px;
      color: #71767b;
      font-size: 13px;
    }

    .metric {
      display: flex;
      align-items: center;
      gap: 4px;
      cursor: default;
      transition: color 0.15s;
    }

    .metric svg {
      width: 1.25em;
      height: 1.25em;
      fill: currentColor;
    }

    /* Like icon - larger and clean */
    .metric.like svg {
  width: 1.25em;
  height: 1.25em;
  flex-shrink: 0;
    }

    .metric:hover { color: #1d9bf0; }
    .metric.like:hover { color: #f91880; }
    .metric.repost:hover { color: #00ba7c; }
    .metric.bookmark:hover { color: #1d9bf0; }

    .actions {
      margin-top: 24px;
      text-align: center;
    }

    .hint {
      font-size: 13px;
      color: #71767b;
      margin-top: 12px;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="wrapper">
    <!-- FORM -->
    <div id="form-section">
      <h1>
        <svg viewBox="0 0 24 24" width="24" height="24" fill="#e7e9ea">
          <path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-4.714-6.231-5.307 6.231H2.834l7.73-8.835L1.254 2.25H8.08l4.253 5.622L18.244 2.25zm-1.161 17.52h1.833L7.084 4.126H5.117L17.083 19.77z"/>
        </svg>
        Create X Post
      </h1>

      <div class="row">
        <div class="form-group">
          <label for="displayName">Display Name</label>
          <input type="text" id="displayName" value="EmmieOola" placeholder="EmmieOola">
        </div>
        <div class="form-group">
          <label for="username">Username (without @)</label>
          <input type="text" id="username" value="EmmieOola" placeholder="EmmieOola">
        </div>
      </div>

      <div class="form-group">
        <label for="postText">Quote / Advice</label>
        <textarea id="postText" placeholder="Type your quote or advice here..."></textarea>
      </div>

      <div class="row">
        <div class="form-group">
          <label for="likes">Likes</label>
          <input type="number" id="likes" value="128" min="0">
        </div>
        <div class="form-group">
          <label for="comments">Comments (optional)</label>
          <input type="number" id="comments" value="0" min="0">
        </div>
      </div>

      <div class="row">
        <div class="form-group">
          <label for="reposts">Reposts</label>
          <input type="number" id="reposts" value="24" min="0">
        </div>
        <div class="form-group">
          <label for="views">Views</label>
          <input type="number" id="views" value="4820" min="0">
        </div>
      </div>

      <div class="form-group">
        <label for="timeAgo">Time (e.g. 2h, 4h, Oct 8)</label>
        <input type="text" id="timeAgo" value="3h" placeholder="3h">
      </div>

      <p class="hint-small">
        Profile picture: put <strong>profile_picture.jpg</strong> or <strong>profile_picture.png</strong> in the same folder as this file.
      </p>

      <button onclick="generatePost()">Generate Post</button>
    </div>

    <!-- GENERATED POST -->
    <div id="post-section">
      <div class="post-card" id="postCard">
        <div class="post-header">
          <div class="avatar-container">
            <img id="avatarImg" class="avatar-img" alt="Profile picture">
            <div class="avatar-fallback" id="avatarFallback">EO</div>
          </div>
          <div class="user-meta">
            <div class="name-row">
              <span class="display-name" id="displayNameText">EmmieOola</span>
              <svg class="verified" viewBox="0 0 22 22" aria-label="Verified account" role="img">
                <g>
                  <path d="M20.396 11c-.018-.646-.215-1.275-.57-1.816-.354-.54-.852-.972-1.438-1.246.223-.607.27-1.264.14-1.897-.131-.634-.437-1.218-.882-1.687-.47-.445-1.053-.75-1.687-.882-.633-.13-1.29-.083-1.897.14-.273-.587-.704-1.086-1.245-1.44S11.647 1.62 11 1.604c-.646.017-1.273.213-1.813.568s-.969.854-1.24 1.44c-.608-.223-1.267-.272-1.902-.14-.635.13-1.22.436-1.69.882-.445.47-.749 1.055-.878 1.688-.13.633-.08 1.29.144 1.896-.587.274-1.087.705-1.443 1.245-.356.54-.555 1.17-.574 1.817.02.647.218 1.276.574 1.817.356.54.856.972 1.443 1.245-.224.606-.274 1.263-.144 1.896.13.634.433 1.218.877 1.688.47.443 1.054.747 1.687.878.633.132 1.29.084 1.897-.136.274.586.705 1.084 1.246 1.439.54.354 1.17.551 1.816.569.647-.016 1.276-.213 1.817-.567s.972-.854 1.245-1.44c.604.239 1.266.296 1.903.164.636-.132 1.22-.447 1.68-.907.46-.46.776-1.044.908-1.681s.075-1.299-.165-1.903c.586-.274 1.084-.705 1.439-1.246.354-.54.551-1.17.569-1.816zM9.662 14.85l-3.429-3.428 1.293-1.302 2.072 2.072 4.4-4.794 1.347 1.246z"></path>
                </g>
              </svg>
            </div>
            <div class="handle-time">
              <span id="handleText">@EmmieOola</span>
              <span class="dot">·</span>
              <span id="displayTime">3h</span>
            </div>
          </div>
        </div>

        <div class="post-content" id="displayText"></div>

        <div class="metrics">
          <!-- Reply -->
          <div class="metric">
            <svg viewBox="0 0 24 24"><g><path d="M1.751 10c0-4.42 3.584-8 8.005-8h4.366c4.49 0 8.129 3.64 8.129 8.13 0 2.96-1.607 5.68-4.196 7.11l-8.054 4.46v-3.69h-.067c-4.49.1-8.183-3.51-8.183-8.01zm8.005-6c-3.317 0-6.005 2.69-6.005 6 0 3.37 2.77 6.08 6.138 6.01l.351-.01h1.761v2.3l5.087-2.81c1.951-1.08 3.163-3.13 3.163-5.36 0-3.39-2.744-6.13-6.129-6.13H9.756z"></path></g></svg>
            <span id="displayComments">0</span>
          </div>

          <!-- Repost -->
          <div class="metric repost">
            <svg viewBox="0 0 24 24"><g><path d="M4.5 3.88l4.432 4.14-1.364 1.46L5.5 7.55V16c0 1.1.896 2 2 2H13v2H7.5c-2.209 0-4-1.79-4-4V7.55L1.432 9.48.068 8.02 4.5 3.88zM16.5 6H11V4h5.5c2.209 0 4 1.79 4 4v8.45l2.068-1.93 1.364 1.46-4.432 4.14-4.432-4.14 1.364-1.46 2.068 1.93V8c0-1.1-.896-2-2-2z"></path></g></svg>
            <span id="displayReposts">0</span>
          </div>

          
<!-- Like -->
<div class="metric like">
  <svg viewBox="0 0 24 24" aria-hidden="true">
    <path d="M20.884 13.888l-7.01 7.01a1.25 1.25 0 0 1-1.768 0l-7.01-7.01a5.5 5.5 0 0 1 7.778-7.778l.116.116.116-.116a5.5 5.5 0 0 1 7.778 7.778z"/>
  </svg>
  <span id="displayLikes">0</span>
</div>


          <!-- Views -->
          <div class="metric">
            <svg viewBox="0 0 24 24"><g><path d="M8.75 21V7.5h2.5V21h-2.5zM18 21V10.5h2.5V21H18zM4 21l.004-6.5H6.5V21H4zm9.25 0v-9h2.5v9h-2.5z"></path></g></svg>
            <span id="displayViews">0</span>
          </div>

          <!-- Bookmark -->
          <div class="metric bookmark">
            <svg viewBox="0 0 24 24"><g><path d="M4 4.5C4 3.12 5.119 2 6.5 2h11C18.881 2 20 3.12 20 4.5v18.44l-8-5.71-8 5.71V4.5zM6.5 4c-.276 0-.5.22-.5.5v14.56l6-4.29 6 4.29V4.5c0-.28-.224-.5-.5-.5h-11z"></path></g></svg>
          </div>

          <!-- Share (correct current X icon) -->
          
<!-- Share: three connected dots -->
<div class="metric share">
  <svg viewBox="0 0 24 24"
       aria-hidden="true">
    <path d="M8.5 12L15.5 6.5M8.5 12l7 5.5"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"/>
    <circle cx="6" cy="12" r="3"
            fill="currentColor"/>
    <circle cx="18" cy="5" r="3"
            fill="currentColor"/>
    <circle cx="18" cy="19" r="3"
            fill="currentColor"/>
  </svg>
</div>

        </div>
      </div>

      <div class="actions">
        <button class="secondary" onclick="resetForm()">← Create Another Post</button>
        <p class="hint">Screenshot the post above · Ready for GitHub Pages</p>
      </div>
    </div>
  </div>

  <script>
    function formatNumber(num) {
      num = parseInt(num) || 0;
      if (num >= 1000000) return (num / 1000000).toFixed(1).replace(/\.0$/, '') + 'M';
      if (num >= 1000) return (num / 1000).toFixed(1).replace(/\.0$/, '') + 'K';
      return num.toString();
    }

    function getInitials(name) {
      if (!name) return 'EO';
      const parts = name.trim().split(/\s+/);
      if (parts.length >= 2) {
        return (parts[0][0] + parts[1][0]).toUpperCase();
      }
      return name.substring(0, 2).toUpperCase();
    }

    function setAvatar(displayName) {
      const img = document.getElementById('avatarImg');
      const fallback = document.getElementById('avatarFallback');
      
      fallback.textContent = getInitials(displayName);
      fallback.style.display = 'flex';
      img.style.display = 'none';
      img.src = '';

      img.onload = function() {
        img.style.display = 'block';
        fallback.style.display = 'none';
      };

      img.onerror = function() {
        if (img.src.includes('profile_picture.jpg')) {
          img.src = 'profile_picture.png';
        } else {
          img.style.display = 'none';
          fallback.style.display = 'flex';
        }
      };

      img.src = 'profile_picture.jpg';
    }

    function generatePost() {
      const displayName = document.getElementById('displayName').value.trim() || 'EmmieOola';
      const username = document.getElementById('username').value.trim() || 'EmmieOola';
      const text = document.getElementById('postText').value.trim();
      
      if (!text) {
        alert('Please enter a quote or advice.');
        return;
      }

      const likes = document.getElementById('likes').value;
      const comments = document.getElementById('comments').value || 0;
      const reposts = document.getElementById('reposts').value || 0;
      const views = document.getElementById('views').value || 0;
      const time = document.getElementById('timeAgo').value.trim() || '3h';

      document.getElementById('displayNameText').textContent = displayName;
      document.getElementById('handleText').textContent = '@' + username;
      document.getElementById('displayText').textContent = text;
      document.getElementById('displayLikes').textContent = formatNumber(likes);
      document.getElementById('displayComments').textContent = formatNumber(comments);
      document.getElementById('displayReposts').textContent = formatNumber(reposts);
      document.getElementById('displayViews').textContent = formatNumber(views);
      document.getElementById('displayTime').textContent = time;

      setAvatar(displayName);

      document.getElementById('form-section').style.display = 'none';
      document.getElementById('post-section').style.display = 'block';
      document.getElementById('postCard').scrollIntoView({ behavior: 'smooth', block: 'center' });
    }

    function resetForm() {
      document.getElementById('form-section').style.display = 'block';
      document.getElementById('post-section').style.display = 'none';
      document.getElementById('postText').focus();
    }

    document.getElementById('postText').addEventListener('keydown', function(e) {
      if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
        generatePost();
      }
    });
  </script>
</body>
</html>
